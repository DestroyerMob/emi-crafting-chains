modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Craft selected EMI recipe chains, recursively crafting ordinary crafting-table
ingredients from the player inventory, AE2, or Tom's Storage.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="emi"
mandatory=true
versionRange="[1.1.24,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=false
versionRange="[15.4.10,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="toms_storage"
mandatory=false
versionRange="[1.7.1,)"
ordering="AFTER"
side="BOTH"
